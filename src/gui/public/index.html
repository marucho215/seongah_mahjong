<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<!-- 휴대폰이 PC 폭으로 그린 뒤 축소하지 않도록 (join.html과 같다) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Seongah Majak — Human Play</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 시작 화면: 모드/상대/시드를 고른다. 텍스트와 수치만으로 구성한다 (app.js의 renderSetup). -->
  <div id="setup-screen" class="hidden"></div>

  <!-- One table, four visual positions (bottom/right/top/left); built by app.js so 3- and
       4-player games share the same DOM and only hide the unused position. -->
  <div id="table" data-players="3"></div>

  <div id="action-bar"></div>

  <!-- 친선전(C단계): 내 차례의 남은 시간, 내가 자리 비움일 때의 안내와 복귀 버튼 (app.js가 채운다) -->
  <div id="turn-timer" class="hidden" role="timer" aria-live="off"></div>
  <div id="away-banner" class="hidden" role="status">
    <span>자리 비움 상태입니다. 중립 AI가 대신 두고 있습니다.</span>
    <button type="button" class="away-return">복귀</button>
  </div>

  <!-- 최근 공개 행동 몇 개만 작게 (AI 턴 장면 재생 중 상황 파악용) -->
  <div id="recent-feed" class="hidden"></div>

  <!-- 재생 설정: 자동 플레이 옵션 + AI 진행 속도 (app.js가 연결) + 효과음 음소거/마스터 볼륨 (audioManager.js가 연결) -->
  <div id="audio-controls">
    <!-- 좁거나 낮은 화면(휴대폰)에서만 보인다: 나머지 조작을 이 버튼 아래로 접는다 (style.css의 모바일 절) -->
    <button type="button" class="controls-toggle" aria-expanded="false" aria-controls="audio-controls" title="대국 옵션 열기/닫기">메뉴</button>
    <button type="button" class="abandon-button hidden" title="진행 중인 대국을 그만두고 로비로 돌아갑니다 (리플레이는 저장하지 않음)">대국 그만두기</button>
    <button type="button" class="auto-toggle" data-auto="tsumogiri" aria-pressed="false" title="쯔모 뒤 타패 차례에 뽑은 패를 자동으로 버립니다 (리치는 선언하지 않음)">자동 쯔모기리</button>
    <button type="button" class="auto-toggle" data-auto="passCalls" aria-pressed="false" title="치·퐁·대명깡 제안을 자동으로 넘깁니다 (암깡·가깡·북 빼기는 제외)">울기 패스</button>
    <button type="button" class="auto-toggle" data-auto="autoWin" aria-pressed="false" title="론·쯔모가 가능하면 자동으로 선언합니다">자동 화료</button>
    <button type="button" class="auto-toggle" data-assist="shanten" aria-pressed="true" title="내 손의 샹텐/텐파이 문구를 보여 줍니다. 대기패와 후리텐 표시는 끄더라도 보입니다 (표시 전용)">샹텐 표시</button>
    <button type="button" class="auto-toggle" data-assist="risk" aria-pressed="false" title="리치한 상대가 있을 때 내 손패마다 버림패 기준 위험도(낮음/주의/높음)를 보여 줍니다 (현물·스지만 보는 상대적 표시, 표시 전용)">위험도 표시</button>
    <select class="speed-select" aria-label="AI 진행 속도">
      <option value="slow">느림</option>
      <option value="normal">보통</option>
      <option value="fast">빠름</option>
      <option value="instant">즉시</option>
    </select>
    <button type="button" class="audio-mute">소리 켬</button>
    <input type="range" class="audio-volume" min="0" max="1" step="0.05" value="0.8" aria-label="볼륨" />
  </div>

  <!-- 휴대폰 세로 화면에서 대국 중일 때만 보인다 (style.css): 작탁은 가로 화면에 맞춰 그린다 -->
  <div id="rotate-hint" role="status">
    <div class="rotate-hint-box">
      <div class="rotate-hint-icon" aria-hidden="true">⟳</div>
      <p>휴대폰을 가로로 돌려 주세요.</p>
      <p class="rotate-hint-sub">대국과 리플레이 화면은 가로 화면에 맞춰져 있습니다. 로비는 세로로도 쓸 수 있습니다.</p>
    </div>
  </div>

  <div id="hand-end-overlay" class="overlay hidden">
    <div id="hand-end-panel" class="overlay-panel"></div>
  </div>

  <script src="/audioManager.js"></script>
  <script src="/app.js"></script>
  <!-- 리플레이 모드(/?replay=): 같은 작탁에서 리플레이를 본다 -->
  <script src="/replayMode.js"></script>
</body>
</html>
