<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Seongah Majak — 입장</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 온라인 입장: 초대 코드와 닉네임만 받는다. 시작 화면(setup)과 같은 패널 모양을 그대로 쓴다. -->
  <div id="setup-screen">
    <div class="setup-layout">
      <form class="setup-side" id="join-form" autocomplete="off">
        <header class="setup-header">
          <h1>Seongah Majak</h1>
          <p class="setup-lead">초대 코드와 닉네임을 입력하면 입장합니다.</p>
        </header>
        <section class="setup-section">
          <label class="setup-field">
            <span class="field-label">초대 코드</span>
            <input class="setup-input" name="inviteCode" type="password" required />
          </label>
          <label class="setup-field">
            <span class="field-label">닉네임 (12자 이하)</span>
            <input class="setup-input" name="nickname" maxlength="12" required />
          </label>
          <p class="setup-lead join-current hidden"></p>
        </section>
        <p class="setup-error hidden" role="alert"></p>
        <button type="submit" class="setup-start">입장</button>
      </form>
    </div>
  </div>
  <script src="/join.js"></script>
</body>
</html>
